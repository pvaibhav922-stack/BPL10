<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>BPL 10 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.s{display:none;height:100vh;padding:16px;background:radial-gradient(circle at 50% 0,#552113,#08090d 58%)}.s.a{display:block}.top{display:flex;justify-content:space-between;align-items:center;color:#ffd45b;font-weight:900}.card{background:#141822dd;border:1px solid #80531e;border-radius:18px;padding:14px;margin:12px 0}.btn{width:100%;padding:14px;border-radius:14px;border:1px solid #9a6720;background:#171c26;color:#fff;font-weight:800;font-size:17px;margin:6px 0}.gold{background:linear-gradient(#ffd15b,#df8c16);color:#17100a;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{padding:14px;border-radius:16px;touch-action:manipulation;cursor:pointer;user-select:none;background:#151a24;color:white;border:1px solid #80531e;font-weight:800}.team small{display:block;color:#bbb;margin-top:6px}.pl{display:flex;justify-content:space-between;padding:12px;background:#151923;border-radius:12px;margin:6px 0;border:1px solid #303543}.rt{color:#ffd45b;font-weight:900}
#game{padding:0;background:#111}.hud{position:absolute;top:8px;left:8px;right:8px;z-index:10;background:#111722eF;border:1px solid #875a23;border-radius:13px;padding:9px;display:flex;justify-content:space-between}.field{position:absolute;inset:0;background:linear-gradient(#7194bc 0 36%,#31552b 36%)}.stands{position:absolute;top:25%;left:0;right:0;height:12%;background:repeating-linear-gradient(90deg,#263a50 0 30px,#8b4c38 30px 45px)}.pitch{position:absolute;left:27%;width:46%;top:37%;bottom:7%;background:#bd965f;border:5px solid #d6ad70;transform:perspective(600px) rotateX(7deg)}.crease{position:absolute;left:10%;right:10%;bottom:16%;height:3px;background:#fff}.batter{position:absolute;left:50%;bottom:17%;width:78px;height:160px;z-index:5;transform:translateX(-50%)}.head{width:38px;height:38px;background:#9a5b35;border:5px solid #272727;border-radius:50%;margin:auto}.shirt{width:52px;height:72px;background:#a9251b;border-radius:15px;margin:auto}.leg{display:inline-block;width:16px;height:50px;background:#222;margin:0 5px}.bat{position:absolute;width:13px;height:96px;background:#e28b2c;border:2px solid #6a3b12;border-radius:5px;right:-17px;top:62px;transform:rotate(-35deg)}.bowler{position:absolute;left:50%;top:32%;z-index:3}.bhead{width:25px;height:25px;background:#9a5b35;border-radius:50%;margin:auto}.bbody{width:30px;height:50px;background:#243d77;border-radius:10px}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#e12b2b;z-index:6;left:49%;top:42%;box-shadow:0 0 10px #ff8b70}.msg{position:absolute;z-index:9;left:50%;top:47%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:50px;font-weight:1000;color:#ffd45b;text-shadow:0 4px #512000;white-space:nowrap}.controls{position:absolute;z-index:8;bottom:14px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{padding:15px;border-radius:14px;border:1px solid #a66d1f;background:#131923eF;color:white;font-size:17px;font-weight:900}.small{color:#aaa;text-align:center;font-size:12px}
</style></head><body>
<section id="home" class="s a"><div class="top"><b style="font-size:25px">🏏 BPL 10</b><span>V2</span></div><div class="card" style="text-align:center;margin-top:70px"><div style="font-size:70px">🏰</div><h1 style="color:#ffd45b">BALEWADI PREMIERE LEAGUE</h1><p>RAIGAD SPIRIT • FAST CRICKET</p></div><button class="btn gold" onclick="show('teams')">🏏 QUICK MATCH • 5 OVERS</button><button class="btn">🏆 TOURNAMENT • COMING SOON</button></section>
<section id="teams" class="s"><button class="btn" onclick="show('home')">← BACK</button><h2 style="color:#ffd45b;text-align:center">SELECT TEAM</h2><div id="tg" class="grid"></div></section>
<section id="players" class="s"><button class="btn" onclick="show('teams')">← BACK</button><h2 style="color:#ffd45b;text-align:center">SELECT PLAYER</h2><div id="pg"></div><button class="btn gold" onclick="start()">START MATCH</button></section>
<section id="game" class="s"><div class="field"></div><div class="stands"></div><div class="hud"><div><b id="tn">RAIGAD RANVEER</b><br><b id="sc">0/0</b></div><div style="text-align:right"><span id="ov">0.0 / 5</span><br>Bat: <b id="bn">Vaibhav</b></div></div><div class="pitch"><div class="crease"></div></div><div class="bowler"><div class="bhead"></div><div class="bbody"></div></div><div id="bat" class="batter"><div class="head"></div><div class="shirt"></div><div class="leg"></div><div class="leg"></div><div class="bat"></div></div><div id="ball" class="ball"></div><div id="msg" class="msg"></div><div class="controls"><button onclick="shot('DEFENCE')">🛡️ DEFENCE</button><button onclick="shot('DRIVE')">🏏 DRIVE</button><button onclick="shot('LOFT')">🚀 LOFT</button><button onclick="shot('SWEEP')">⚡ SWEEP</button></div></section>
<section id="result" class="s"><h1 style="color:#ffd45b;text-align:center">INNINGS OVER</h1><div class="card" style="text-align:center"><h2 id="ft">RAIGAD RANVEER</h2><div id="fs" style="font-size:52px;color:#ffd45b;font-weight:900">0/0</div><p id="detail"></p></div><button class="btn gold" onclick="start()">🏏 PLAY AGAIN</button><button class="btn" onclick="show('teams')">🔄 CHANGE TEAM</button></section>
<script>
const teams=['Raigad Ranveer','Raigad Parakrami','Sinhagad Rakshak','Panhala Shurveer','Shivneri Yoddha','Pratapgad Shiledar'];const ps=[['Vaibhav',92],['Justii',85],['Bandy',78],['N.b',80],['Vastya',76],['Amol',83],['Aj',79],['Mahi',81],['Dhiru',77],['Akash',75],['Re',72],['Pratik',78],['Uttam',76],['Kiran',74]];let ti=0,pi=0,r=0,w=0,b=0,f=0,sx=0;
const E={tg:document.getElementById('tg'),pg:document.getElementById('pg'),tn:document.getElementById('tn'),bn:document.getElementById('bn'),sc:document.getElementById('sc'),ov:document.getElementById('ov'),msg:document.getElementById('msg'),bat:document.getElementById('bat'),ball:document.getElementById('ball'),ft:document.getElementById('ft'),fs:document.getElementById('fs'),detail:document.getElementById('detail')};
function show(id){document.querySelectorAll('.s').forEach(x=>x.classList.remove('a'));const el=document.getElementById(id);if(el)el.classList.add('a')}function render(){E.tg.innerHTML=teams.map((x,i)=>`<button class="team" onclick="selectTeam(${i})"><div style="font-size:38px">🏰</div>${x}<small>${['रायगड रणवीर','रायगड पराक्रमी','सिंहगड रक्षक','पन्हाळा शूरवीर','शिवनेरी योद्धा','प्रतापगड शिलेदार'][i]}</small></button>`).join('');renderP()}function selectTeam(i){ti=i;show('players');renderP()}function renderP(){E.pg.innerHTML=ps.map((x,i)=>`<div class="pl" onclick="selectPlayer(${i})"><span>${i+1}. ${x[0]} ${pi===i?'🟡':''}</span><span class="rt">${x[1]}</span></div>`).join('')}function selectPlayer(i){pi=i;renderP()}function start(){r=w=b=f=sx=0;E.tn.textContent=teams[ti].toUpperCase();E.bn.textContent=ps[pi][0];show('game');upd()}function upd(){E.sc.textContent=`${r}/${w}`;E.ov.textContent=`${Math.floor(b/6)}.${b%6} / 5`}function shot(t){if(b>=30)return end();b++;let q=Math.random(),v=0;if(q<.055){w++;flash('WICKET!')}else{let ranges={DEFENCE:[0,.8,.95,0,0],DRIVE:[0,.08,.52,.91,1],LOFT:[0,.16,.48,.73,1],SWEEP:[0,.1,.55,.92,1]}[t];if(q<ranges[1])v=0;else if(q<ranges[2])v=1;else if(q<ranges[3])v=2;else v=q<.96?4:6;if(v===4){f++;flash('FOUR!')}else if(v===6){sx++;flash('SIX!')}else flash(v===0?'DOT BALL':'+'+v);r+=v}upd();if(b>=30)setTimeout(end,700)}function flash(x){E.msg.textContent=x;E.msg.style.opacity=1;E.msg.style.transform='translate(-50%,-50%) scale(1)';E.bat.animate([{transform:'translateX(-50%) rotate(0)'},{transform:'translateX(-50%) rotate(16deg)'},{transform:'translateX(-50%) rotate(0)'}],{duration:400});E.ball.animate([{left:'49%',top:'42%'},{left:'48%',top:'27%'},{left:'50%',top:'42%'}],{duration:430});setTimeout(()=>{E.msg.style.opacity=0;E.msg.style.transform='translate(-50%,-50%) scale(.6)'},600)}function end(){show('result');E.ft.textContent=teams[ti].toUpperCase();E.fs.textContent=`${r}/${w}`;E.detail.textContent=`${Math.floor(b/6)}.${b%6} overs • ${f} fours • ${sx} sixes • ${ps[pi][0]} batting`}render();
</script></body></html>
